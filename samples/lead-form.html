<!doctype html>
<html lang="ko">
  <head>
    <title>리드마그넷 신청</title>
    <style>
      body { color: #20221f; background: #f7f7f5; }
      form { display: grid; gap: 16px; }
      input, select, button { padding: 12px; border: 1px solid #dedfd8; border-radius: 12px; }
      button { background: #20221f; color: white; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-form-title>무료 체크리스트 받기</h1>
      <p data-form-description>업무에 바로 쓰는 체크리스트를 이메일로 보내드립니다.</p>
      <form>
        <label for="name">이름</label>
        <input id="name" name="name" type="text" required>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" required>
        <label for="role">직무</label>
        <select id="role" name="role" required>
          <option value="marketing">마케팅</option>
          <option value="sales">영업</option>
        </select>
        <button type="submit" data-form-submit>체크리스트 신청하기</button>
      </form>
    </main>
  </body>
</html>
