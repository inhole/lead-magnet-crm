name: CI 결과 집계 도구 검증
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: 테스트 결과 집계 로직
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 집계 도구 단위 테스트
        run: python scripts/ci/run_harness_tests.py
      - name: 검증 결과 표 생성
        if: always()
        run: >-
          python scripts/ci/korean_summary.py reports/harness-counts.json
          --label "CI 결과 집계 도구 검증"
          --description "앱 기능이 아니라 테스트 결과를 집계하고 표시하는 CI 도구 자체를 검증합니다."
      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-results
          path: reports/harness-counts.json
          if-no-files-found: warn
          retention-days: 7
